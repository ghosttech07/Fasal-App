<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123f2c">
<title>No signal · FasalShield</title>
<style>
  :root { --board: #123f2c; --ground: #f3f5f1; --ink: #15201a; --ink-2: #47534c; --marigold: #f5b800; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font: 17px/1.5 system-ui, sans-serif; display: grid; grid-template-rows: auto 1fr; }
  header { background: var(--board); color: #fff; padding: max(28px, env(safe-area-inset-top)) 20px 28px; }
  header b { display: flex; align-items: center; gap: 10px; font-size: 20px; }
  h1 { margin: 20px 0 0; font-size: 30px; line-height: 1.15; }
  main { padding: 24px 20px; display: grid; gap: 16px; align-content: start; }
  p { margin: 0; color: var(--ink-2); }
  button { min-height: 56px; border: 0; border-radius: 10px; background: var(--board); color: #fff; font: inherit; font-weight: 600; font-size: 18px; }
  button:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <b><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.7c3.4 4.4 6.3 8 6.3 11.3a6.3 6.3 0 0 1-12.6 0c0-3.3 2.9-6.9 6.3-11.3z" fill="#f5b800"/></svg>FasalShield</b>
  <h1>No signal right now</h1>
</header>
<main>
  <p>Your cover keeps working: the satellite checks the rain for your field every day, and any payout still goes to your UPI by itself.</p>
  <p>Move to a place with signal, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>addEventListener('online', () => location.reload());</script>
</body>
</html>
